name: Planner V2 build

on:
  push:
    branches:
      - feature/planner-bre-v2
    paths:
      - "v2/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "docs/ARCHITECTURE_V2.md"
      - "docs/SUPABASE_DEV_VALIDATION.md"
      - ".github/workflows/v2-build.yml"
  pull_request:
    paths:
      - "v2/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "docs/ARCHITECTURE_V2.md"
      - "docs/SUPABASE_DEV_VALIDATION.md"
      - ".github/workflows/v2-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d planner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and verify dependency graph
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --json > npm-audit.json || echo "npm audit reported advisories; inspect the uploaded report"
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-v2-dependency-review
          path: |
            v2/npm-audit.json
            v2/package-lock.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce dependency audit threshold
        run: npm audit --audit-level=moderate
      - name: Type-check and build
        run: npm run build
      - name: Run automated frontend and data-service tests
        run: npm test
      - name: Validate PostgreSQL migration syntax
        run: |
          python -m pip install --disable-pip-version-check pglast
          python -c "from pathlib import Path; from pglast import parse_sql; files = sorted(Path('../supabase/migrations').glob('*.sql')); [parse_sql(path.read_text()) for path in files]; print(f'{len(files)} migration files: SQL syntax OK')"
      - name: Bootstrap isolated Supabase test objects
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -f ../supabase/tests/bootstrap.sql
      - name: Apply migrations to temporary PostgreSQL
        run: |
          for migration in ../supabase/migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run schema integrity smoke tests
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -f ../supabase/tests/schema_smoke.sql
      - name: Verify row-level security isolation
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -f ../supabase/tests/rls_role_smoke.sql
      - name: Verify RLS aggregate isolation
        run: |
          SUMMARY_ONE=$(PGPASSWORD=postgres PGOPTIONS="-c role=authenticated -c request.jwt.claim.sub=11111111-1111-4111-8111-111111111111" psql -qAt -F "," -h localhost -U postgres -d planner_test -c "SELECT * FROM public.get_study_summary();")
          SUMMARY_TWO=$(PGPASSWORD=postgres PGOPTIONS="-c role=authenticated -c request.jwt.claim.sub=22222222-2222-4222-8222-222222222222" psql -qAt -F "," -h localhost -U postgres -d planner_test -c "SELECT * FROM public.get_study_summary();")
          test "$SUMMARY_ONE" = "2,30,10,7"
          test "$SUMMARY_TWO" = "1,0,0,0"
          echo "RLS aggregate isolation: OK"
      - name: Verify transactional V2 backup restore
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -f ../supabase/tests/restore_smoke.sql
      - name: Verify atomic V1 legacy import and safe retry
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -f ../supabase/tests/legacy_import_smoke.sql
