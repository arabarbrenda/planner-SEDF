name: Planner V2 build

on:
  push:
    branches:
      - feature/planner-bre-v2
    paths:
      - "v2/**"
      - "supabase/migrations/**"
      - "docs/ARCHITECTURE_V2.md"
      - ".github/workflows/v2-build.yml"
  pull_request:
    paths:
      - "v2/**"
      - "supabase/migrations/**"
      - "docs/ARCHITECTURE_V2.md"
      - ".github/workflows/v2-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
