name: Planner V2 build

on:
  push:
    branches:
      - feature/planner-bre-v2
    paths:
      - "v2/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "docs/ARCHITECTURE_V2.md"
      - ".github/workflows/v2-build.yml"
  pull_request:
    paths:
      - "v2/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "docs/ARCHITECTURE_V2.md"
      - ".github/workflows/v2-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d planner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Validate PostgreSQL migration syntax
        run: |
          python -m pip install --disable-pip-version-check pglast
          python -c "from pathlib import Path; from pglast import parse_sql; sql = Path('../supabase/migrations/0001_initial_schema.sql').read_text(); parse_sql(sql); print('Migration SQL syntax: OK')"
      - name: Bootstrap isolated Supabase test objects
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -f ../supabase/tests/bootstrap.sql
      - name: Apply migration to temporary PostgreSQL
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -f ../supabase/migrations/0001_initial_schema.sql
      - name: Run schema integrity smoke tests
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -f ../supabase/tests/schema_smoke.sql
      - name: Verify row-level security isolation
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SET request.jwt.claim.sub = '11111111-1111-4111-8111-111111111111'; INSERT INTO public.subjects (user_id, name) VALUES (auth.uid(), 'RLS visible subject');"
          COUNT_ONE=$(PGPASSWORD=postgres psql -qAt -h localhost -U postgres -d planner_test -c "SET ROLE authenticated; SET request.jwt.claim.sub = '11111111-1111-4111-8111-111111111111'; SELECT count(*) FROM public.subjects;")
          COUNT_TWO=$(PGPASSWORD=postgres psql -qAt -h localhost -U postgres -d planner_test -c "SET ROLE authenticated; SET request.jwt.claim.sub = '22222222-2222-4222-8222-222222222222'; SELECT count(*) FROM public.subjects;")
          test "$COUNT_ONE" = "2"
          test "$COUNT_TWO" = "1"
          if PGPASSWORD=postgres psql -h localhost -U postgres -d planner_test -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SET request.jwt.claim.sub = '22222222-2222-4222-8222-222222222222'; INSERT INTO public.subjects (user_id, name) VALUES ('11111111-1111-4111-8111-111111111111', 'forbidden');"; then
            echo "RLS unexpectedly allowed cross-user insert"
            exit 1
          fi
          echo "RLS isolation: OK"
