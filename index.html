        }

        function closeMobileMenu() {
            const sidebar = document.getElementById('sidebar');

            if (sidebar) sidebar.classList.add('-translate-x-full');

        let appData = JSON.parse(JSON.stringify(defaultData));

        function loadPersistedData() {
            const defaults = JSON.parse(JSON.stringify(defaultData));
            try {
                const raw = localStorage.getItem("sga_sedf_2027_data") || localStorage.getItem("sedf_2027_db");
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) ||
                        (parsed.materias !== undefined && !Array.isArray(parsed.materias)) ||
                        (parsed.registrosEstudo !== undefined && !Array.isArray(parsed.registrosEstudo)) ||
                        (parsed.simulados !== undefined && !Array.isArray(parsed.simulados)) ||
                        (parsed.jurisprudencia !== undefined && !Array.isArray(parsed.jurisprudencia)) ||
                        (parsed.config !== undefined && (!parsed.config || typeof parsed.config !== 'object' || Array.isArray(parsed.config)))) {
                        throw new Error('Estrutura local inválida.');
                    }
                    appData = Object.assign({}, defaults, parsed);
                    appData.config = Object.assign({}, defaultData.config, parsed.config || {});
                    appData.registrosEstudo = Array.isArray(parsed.registrosEstudo) ? parsed.registrosEstudo : [];
                    appData.simulados = Array.isArray(parsed.simulados) ? parsed.simulados : [];
                    appData.jurisprudencia = Array.isArray(parsed.jurisprudencia) ? parsed.jurisprudencia : [];
                    const validLocalPlanActions = value => value && typeof value === 'object' && !Array.isArray(value) &&
                        Object.entries(value).every(([key, action]) => /^\\d{4}-\\d{2}-\\d{2}::\\d+$/.test(key) &&
                            isValidPlannerDate(key.split('::')[0]) && action && typeof action === 'object' && !Array.isArray(action) &&
                            (action.status === undefined || ['', 'Concluído', 'Adiado', 'Substituído'].includes(action.status)) &&
                            (action.materiaId === undefined || typeof action.materiaId === 'string') &&
                            (action.topicoId === undefined || typeof action.topicoId === 'string') &&
                            (action.deferredTo === undefined || isValidPlannerDate(action.deferredTo)));
                    if (parsed.planoAcoes !== undefined && !validLocalPlanActions(parsed.planoAcoes)) throw new Error('Planejamento local inválido.');
                    appData.planoAcoes = parsed.planoAcoes || {};

                    if (Array.isArray(parsed.materias)) {
                        const migrationIdBase = Date.now();
                        appData.materias = parsed.materias.map((m, materiaIndex) => Object.assign({
                            id: m.id || ('m_' + migrationIdBase + '_' + materiaIndex),
                            nome: typeof m.nome === 'string' && m.nome.trim() ? m.nome : 'Matéria',
                            icone: m.icone || 'fa-book',
                            prioridade: m.prioridade || 'Média',
                            topicos: Array.isArray(m.topicos) ? m.topicos.map((t, topicoIndex) => {
                                const total = Number.isInteger(t.questoesTotal) && t.questoesTotal >= 0 ? t.questoesTotal : 0;
                                const acertos = Number.isInteger(t.questoesAcertos) && t.questoesAcertos >= 0 && t.questoesAcertos <= total ? t.questoesAcertos : 0;
                                const checklistBase = { lei: false, questoes: false, erros: false, revisao: false, teoria: false };
                                const checklist = Object.fromEntries(Object.keys(checklistBase).map(k => [k, t.checklist && typeof t.checklist[k] === 'boolean' ? t.checklist[k] : false]));
                                return Object.assign({}, t, {
                                    id: t.id || ('t_' + migrationIdBase + '_' + materiaIndex + '_' + topicoIndex),
                                    nome: typeof t.nome === 'string' ? t.nome : '',
                                    status: ['Não iniciado', 'Estudando', 'Rever', 'Concluído'].includes(t.status) ? t.status : 'Não iniciado',
                                    checklist,
                                    anotaçoes: typeof t.anotaçoes === 'string' ? t.anotaçoes : '',
                                    questoesTotal: total,
                                    questoesAcertos: acertos
                                });
                            }) : []
                        }, m));
                    }
                }
            } catch (e) {
                console.error('Dados locais inválidos. Preservando conteúdo original para recuperação.', e);
                try { const damaged=localStorage.getItem("sga_sedf_2027_data")||localStorage.getItem("sedf_2027_db"); if(damaged) localStorage.setItem("sga_sedf_2027_data_recovery",damaged); } catch(recoveryError) {}
                appData = JSON.parse(JSON.stringify(defaultData));
                window.__plannerDataRecoveryBlocked = true;
            }

            if (!appData.examDate) appData.examDate = "2027-05-20";
            if (!appData.startDate) appData.startDate = "2026-11-23";
            if (!appData.headerTitle || appData.headerTitle === "SGA-SEDF 2027") appData.headerTitle = "SEDF 2027 - PLANNER DA BRE";
            if (!appData.headerSubtitle) appData.headerSubtitle = "Analista - Apoio Administrativo";
            if (!appData.theme) appData.theme = "dark";
            if (!appData.consultDate) appData.consultDate = getLocalDateISO();
        }

        function applyTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');

            if (appData.theme === 'light') {
                body.classList.add('light-mode');
                if (icon) icon.className = 'fa-solid fa-moon text-indigo-500';
                if (text) text.textContent = 'Alternar Modo Escuro';
            } else {
                body.classList.remove('light-mode');
                if (icon) icon.className = 'fa-solid fa-sun text-amber-400';
                if (text) text.textContent = 'Alternar Modo Claro';
            }
        }

        function toggleTheme() {
            const anterior = appData.theme;

            if (!saveData()) {
                appData.theme = anterior;
                applyTheme();
            }
        }

        function saveData() {

                alert('Os dados locais anteriores foram preservados para recuperação. Importe um backup ou confirme a restauração antes de salvar novos dados.');
                return false;
            }
            try {
                localStorage.setItem("sga_sedf_2027_data", JSON.stringify(appData));
            } catch(e) {
                console.error('Falha ao salvar dados do planner:', e);
                alert('Não foi possível salvar os dados no armazenamento local. Evite fechar ou atualizar a página e exporte/registre suas informações, se possível. Verifique o espaço disponível no navegador.');

            updateQuickNav();
            updateSidebarHeader();
            return true;
        }

        function openEditalVerticalizado() {
            const editalText = `EDITAL VERTICALIZADO - SEDF 2027\nCARGO: ANALISTA EM POLÍTICAS PÚBLICAS E GESTÃO EDUCACIONAL - APOIO ADMINISTRATIVO\nBANCA: INSTITUTO QUADRIX\n\n`;
            let conteudo = editalText;
            appData.materias.forEach(m => {
                conteudo += `==================================================\nDISCIPLINA: ${m.nome.toUpperCase()} (Prioridade: ${m.prioridade})\n==================================================\n`;
                m.topicos.forEach((t, i) => {
                    conteudo += `  ${i+1}. ${t.nome} [${t.status}]\n`;
                });
                conteudo += `\n`;
            });
            const blob = new Blob([conteudo], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        function getTopicQuestionStats(topicoId) {
            const records = (appData.registrosEstudo || []).filter(r => r.topicoId === topicoId);
            return { total: records.reduce((a,r)=>a+(Number(r.qTotal)||0),0), correct: records.reduce((a,r)=>a+(Number(r.qAcertos)||0),0) };
        }
        function getDerivedQuestionStats() {
            const records = (appData.registrosEstudo || []).filter(r => Number(r.qTotal)>0);
            return { total: records.reduce((a,r)=>a+(Number(r.qTotal)||0),0), correct: records.reduce((a,r)=>a+(Number(r.qAcertos)||0),0) };
        }
        function populateStudyTopics(selectedId = '') {
            const subject = appData.materias.find(m=>m.id===document.getElementById('modal-materia').value);
            const select=document.getElementById('modal-topico');
            if(!select)return;
            select.innerHTML='<option value="">Sessão geral da matéria (sem tópico)</option>'+(subject?subject.topicos.map(t=>'<option value="'+escapeHTML(t.id)+'">'+escapeHTML(t.nome)+'</option>').join():'');
            if(selectedId)select.value=selectedId;
        }
        function escapeHTML(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function getGlobalStats() {
            let totalTopicos = 0;
            let concluidos = 0;
            let totalQuestoes = 0;
            let totalAcertos = 0;
            let totalMinutos = 0;

            appData.materias.forEach(m => {
                m.topicos.forEach(t => {
                    totalTopicos++;
                    if (t.status === 'Concluído') concluidos++;

                });
            });

            appData.registrosEstudo.forEach(r => {
                totalMinutos += (r.tempo || 0);
            });
            const derivedQuestions = getDerivedQuestionStats();
            totalQuestoes = derivedQuestions.total;
            totalAcertos = derivedQuestions.correct;

            const progressoGeral = totalTopicos > 0 ? Math.round((concluidos / totalTopicos) * 100) : 0;
            const aproveitamentoGeral = totalQuestoes > 0 ? Math.round((totalAcertos / totalQuestoes) * 100) : 0;
            const horasEstudadas = (totalMinutos / 60).toFixed(1);

            const hojeISO = getLocalDateISO();
            const hojeParts = hojeISO.split('-').map(Number);
            const provaParts = appData.examDate.split('-').map(Number);
            const hoje = new Date(hojeParts[0], hojeParts[1]-1, hojeParts[2]);
            const prova = new Date(provaParts[0], provaParts[1]-1, provaParts[2]);
            const diffTime = prova - hoje;
            const diasRestantes = Math.round(diffTime / (1000 * 60 * 60 * 24));

            return { totalTopicos, concluidos, progressoGeral, totalQuestoes, aproveitamentoGeral, horasEstudadas, diasRestantes };
        }

        function getSuggestedStudyBlocks(dayIndex) {
            if (dayIndex === 0) return [];
            const subjects = (appData.materias || []).filter(m => m.topicos && m.topicos.length);
            const priorityScore = m => m.prioridade === 'Alta' ? 0 : m.prioridade === 'Média' ? 1 : 2;
            subjects.sort((a,b) => priorityScore(a)-priorityScore(b) || a.nome.localeCompare(b.nome));
            const offset = dayIndex === 6 ? 0 : (dayIndex - 1) % Math.max(1, subjects.length);
            const rotated = subjects.slice(offset).concat(subjects.slice(0,offset));
            const count = Math.min(3, rotated.length);
            return rotated.slice(0,count).map(m => {
                const unfinished = m.topicos.filter(t => t.status !== 'Concluído');
                const topicPool = unfinished.length ? unfinished : m.topicos;
                const topic = topicPool.find(t => t.status === 'Rever') || topicPool[0];
                return {materia:m, topico:topic};
            });
        }

        function getPlanActionKey(date, slot) { return date + "::" + slot; }

        function getPlanAction(date, slot) {
            if (!appData.planoAcoes) appData.planoAcoes = {};
            return appData.planoAcoes[getPlanActionKey(date, slot)] || {};
        }

        function setPlanAction(date, slot, patch) {
            if (!appData.planoAcoes) appData.planoAcoes = {};
            const key = getPlanActionKey(date, slot);
            const anterior = appData.planoAcoes[key];
            appData.planoAcoes[key] = { ...(anterior || {}), ...patch };
            if (!saveData()) {
                if (anterior) appData.planoAcoes[key] = anterior;
                else delete appData.planoAcoes[key];
                return;
            }
            renderView('planejamento');
        }

        function isValidPlannerDate(value) {
            if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(value || '')) return false;
            const [y, m, d] = value.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d;
        }

        function updateConsultDate(value) {
            if (!isValidPlannerDate(value)) return alert('Data inválida.');
            const anterior = appData.consultDate;
            appData.consultDate = value;
            if (!saveData()) {
                appData.consultDate = anterior;
                return;
            }
            renderView('planejamento');

            if (novo === null || novo.trim() === '') return;
            if (!isValidPlannerDate(novo.trim())) return alert('Data inválida. Use o formato AAAA-MM-DD.');

            appData.examDate = novo.trim();
            if (!saveData()) {

                return;

        function nextStudyDate(date) {
            const parts = date.split('-').map(Number);
            const next = new Date(parts[0], parts[1]-1, parts[2]+1);
            if (next.getDay() === 0) next.setDate(next.getDate()+1);
            return next.getFullYear() + '-' + String(next.getMonth()+1).padStart(2,'0') + '-' + String(next.getDate()).padStart(2,'0');
        }

        function markPlanBlock(date, slot, status) {
            if (status === 'Adiado') {
                const parts = date.split('-').map(Number);
                const next = new Date(parts[0], parts[1]-1, parts[2]+1);
                if (next.getDay() === 0) next.setDate(next.getDate()+1);
                const deferredTo = next.getFullYear() + '-' + String(next.getMonth()+1).padStart(2,'0') + '-' + String(next.getDate()).padStart(2,'0');
                setPlanAction(date, slot, { status: 'Adiado', deferredTo });
                return;
            }
            setPlanAction(date, slot, { status });
        }

        function moveDeferredBlock(actionKey, targetDate) {
            if (!appData.planoAcoes) appData.planoAcoes = {};
            const action = appData.planoAcoes[actionKey];
            if (!action || !isValidPlannerDate(targetDate)) return;
            const anterior = action.deferredTo;
            action.deferredTo = targetDate;
            if (!saveData()) {
                if (anterior === undefined) delete action.deferredTo;
                else action.deferredTo = anterior;
                return;
            }
            renderView('planejamento');
        }

        function updateDeferredAction(actionKey, status, targetDate) {
            const action = (appData.planoAcoes || {})[actionKey];
            if (!action) return;
            const anterior = { ...action };
            action.status = status;
            if (targetDate) action.deferredTo = targetDate;
            if (status === 'Concluído' || status === '') delete action.deferredTo;
            if (!saveData()) {
                Object.assign(action, anterior);
                for (const k of Object.keys(action)) if (!(k in anterior)) delete action[k];
                return;
            }
            renderView('planejamento');
        }

        function replaceDeferredAction(actionKey) {
            const subjects = (appData.materias || []).filter(m => m.topicos && m.topicos.length);

            const anterior = { ...action };

        function replacePlanBlock(date, slot) {

        function renderPlanejamentoHTML() {
            if (!appData.consultDate) appData.consultDate = getLocalDateISO();
            const [ano, mes, dia] = appData.consultDate.split('-');
            const dataObj = new Date(Number(ano), Number(mes)-1, Number(dia));
            const diasSemanaMap = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
            const dayIndex = dataObj.getDay(), nomeDiaSemana = diasSemanaMap[dayIndex];
            const blocos = getSuggestedStudyBlocks(dayIndex);
            const registrosDia = (appData.registrosEstudo || []).filter(r=>r.data===appData.consultDate);
            const minutosDia = registrosDia.reduce((s,r)=>s+(Number(r.tempo)||0),0);
            const questoesDia = registrosDia.reduce((s,r)=>s+(Number(r.qTotal)||0),0);
            const acertosDia = registrosDia.reduce((s,r)=>s+(Number(r.qAcertos)||0),0);
            const historico = [...(appData.registrosEstudo||[])].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
            const pendencias = Object.entries(appData.planoAcoes || {}).filter(([key,action]) => action.status !== 'Concluído' && action.deferredTo && action.deferredTo < appData.consultDate)
                .map(([key,action]) => {
                    const materia = (appData.materias || []).find(m=>m.id===action.materiaId);
                    const topico = materia && materia.topicos.find(t=>t.id===action.topicoId);
                    const origem = key.split('::')[0];
                    const consulta = new Date(appData.consultDate + 'T00:00:00');
                    const inicio = new Date(origem + 'T00:00:00');
                    const ageDays = Math.max(0, Math.round((consulta-inicio)/86400000));
                    return materia && topico ? { key, action, materia, topico, origem, ageDays } : null;
                }).filter(Boolean).sort((a,b)=>a.origem.localeCompare(b.origem));
            const planos = blocos.map((b,i) => {
                const action = getPlanAction(appData.consultDate, i);
                const materia = action.materiaId ? appData.materias.find(m=>m.id===action.materiaId) : b.materia;
                const topico = materia && action.topicoId ? materia.topicos.find(t=>t.id===action.topicoId) : b.topico;
                return { ...b, materia: materia || b.materia, topico: topico || b.topico, action, slot:i };
            });
            const adiados = Object.entries(appData.planoAcoes || {}).filter(([key,action]) => action.status !== 'Concluído' && action.deferredTo === appData.consultDate)
                .map(([key,action]) => {

            container.replaceChildren();

            const save = document.createElement('button');

            save.title = 'Salvar tópico';
            save.innerHTML = '<i class="fa-solid fa-check"></i>';
            save.addEventListener('click', () => saveTopicEdit(materiaId, topicoId));

            const cancel = document.createElement('button');
            cancel.className = 'text-slate-400 hover:text-slate-300 text-xs px-2 py-1 bg-slate-800 rounded-lg';
            cancel.title = 'Cancelar edição';
            cancel.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            cancel.addEventListener('click', () => cancelTopicEdit(materiaId, topicoId));

            container.append(input, save, cancel);
            input.focus();
        }

        function saveTopicEdit(materiaId, topicoId) {
            const input = document.getElementById(`input-edit-topic-${topicoId}`);
            if (!input) return;
            const novoNome = input.value.trim();
            if (novoNome) {
                const m = appData.materias.find(mat => mat.id === materiaId);
                const t = m && m.topicos.find(top => top.id === topicoId);
                if (!t) return;
                const anterior = t.nome;
                t.nome = novoNome;
                if (!saveData()) {
                    t.nome = anterior;
                    return;
                }
                renderView('materia', materiaId);
            }
        }

        function cancelTopicEdit(materiaId, topicoId) {
            renderView('materia', materiaId);
        }

        function clearTopicData(materiaId, topicoId) {
            if (confirm("Deseja realmente limpar todos os dados deste tópico?")) {
                const m = appData.materias.find(mat => mat.id === materiaId);
                const t = m && m.topicos.find(top => top.id === topicoId);
                if (t) {
                    const dadosAnteriores = { ...t, checklist: t.checklist ? { ...t.checklist } : t.checklist };
                    t.status = "Não iniciado";
                    t.checklist = { lei: false, questoes: false, erros: false, revisao: false, teoria: false };
                    t.anotaçoes = "";
                    t.questoesTotal = 0;
                    t.questoesAcertos = 0;
                    if (!saveData()) {
                        Object.assign(t, dadosAnteriores);
                        return;
                    }
                    renderView('materia', materiaId);
                }
            }
        }

        function saveTopicQuestionsDirect(materiaId, topicoId) {
            const totalInput = document.getElementById(`q-total-${topicoId}`);
            const acertosInput = document.getElementById(`q-acertos-${topicoId}`);
            if (!totalInput || !acertosInput) return;
            const total = Number(totalInput.value);
            const acertos = Number(acertosInput.value);
            if (!Number.isInteger(total) || !Number.isInteger(acertos) || total < 0 || acertos < 0 || acertos > total) {
                alert('Informe números inteiros não negativos, com acertos iguais ou inferiores ao total.');
                return;
            }
            const m = appData.materias.find(mat => mat.id === materiaId);
            const t = m && m.topicos.find(top => top.id === topicoId);
            if (!t) return;
            const anterior = { questoesTotal: t.questoesTotal, questoesAcertos: t.questoesAcertos };
            t.questoesTotal = total;
            t.questoesAcertos = acertos;
            if (!saveData()) {
                Object.assign(t, anterior);
                return;
            }
            renderView('materia', materiaId);
        }

        function openStudyModal() {
            const select = document.getElementById('modal-materia');
            select.innerHTML = appData.materias.map(m => `<option value="${escapeHTML(m.id)}">${escapeHTML(m.nome)}</option>`).join('');
            populateStudyTopics();
            document.getElementById('study-form').dataset.editId = '';
            document.getElementById('modal-data').value = getLocalDateISO();
            document.getElementById('study-modal').classList.remove('hidden');
            document.getElementById('study-modal').classList.add('flex');
        }

        function closeStudyModal() {
            document.getElementById('study-modal').classList.remove('flex');
            document.getElementById('study-modal').classList.add('hidden');
        }

        function handleStudySubmit(e) {
            e.preventDefault();
            const materiaId = document.getElementById('modal-materia').value;
            const data = document.getElementById('modal-data').value;
            const plataforma = document.getElementById('modal-plataforma').value;
            const tempo = Number(document.getElementById('modal-tempo').value);
            const qTotal = Number(document.getElementById('modal-qtotal').value || 0);
            const qAcertos = Number(document.getElementById('modal-qacertos').value || 0);
            const obs = document.getElementById('modal-obs').value;
            const topicoId = document.getElementById('modal-topico').value || null;
            const editId = document.getElementById('study-form').dataset.editId;

            if (!materiaId || !isValidPlannerDate(data) || !Number.isInteger(tempo) || tempo < 1 ||
                !Number.isInteger(qTotal) || qTotal < 0 || !Number.isInteger(qAcertos) || qAcertos < 0 || qAcertos > qTotal) {
                alert('Confira os dados: tempo deve ser positivo e acertos não podem exceder o total de questões.');
                return;
            }
            const anterior = appData.registrosEstudo.slice();
            const registro = { id: editId ? Number(editId) : Date.now(), materiaId, topicoId, data, plataforma, tempo, qTotal, qAcertos, obs };
            if(editId) appData.registrosEstudo=appData.registrosEstudo.map(r=>String(r.id)===editId?registro:r);
            else appData.registrosEstudo.push(registro);
            if (!saveData()) { appData.registrosEstudo=anterior; return; }
            closeStudyModal();
            switchTab(currentActiveTab, currentActiveTab === 'materia' ? materiaId : null);
            alert(editId ? 'Sessão atualizada!' : 'Sessão de estudo registrada com sucesso!');
        }
        function editStudyRecord(id) {
            const r=appData.registrosEstudo.find(x=>String(x.id)===String(id)); if(!r)return;
            openStudyModal();
            document.getElementById('study-form').dataset.editId=String(r.id);
            document.getElementById('modal-materia').value=r.materiaId;
            populateStudyTopics(r.topicoId||'');
            document.getElementById('modal-data').value=r.data||getLocalDateISO();
            document.getElementById('modal-plataforma').value=r.plataforma||'Tec Concursos';
            document.getElementById('modal-tempo').value=r.tempo||60;
            document.getElementById('modal-qtotal').value=r.qTotal||0;
            document.getElementById('modal-qacertos').value=r.qAcertos||0;
            document.getElementById('modal-obs').value=r.obs||'';
        }
        function deleteStudyRecord(id) {
            if(!confirm('Excluir esta sessão de estudo?'))return;
            const old=appData.registrosEstudo.slice();
            appData.registrosEstudo=appData.registrosEstudo.filter(r=>String(r.id)!==String(id));
            if(!saveData()){appData.registrosEstudo=old;return;}
            renderView(currentActiveTab);
        }

        function updateTopicStatus(materiaId, topicoId, status) {
            const m = appData.materias.find(mat => mat.id === materiaId);
            const t = m && m.topicos.find(top => top.id === topicoId);
            if (!t) return;
            const anterior = t.status;
            t.status = status;
            if (!saveData()) {
                t.status = anterior;
                renderView('materia', materiaId);
            }
        }

        function toggleChecklist(materiaId, topicoId, key) {
            const m = appData.materias.find(mat => mat.id === materiaId);
            const t = m && m.topicos.find(top => top.id === topicoId);
            if (t && t.checklist && Object.prototype.hasOwnProperty.call(t.checklist, key)) {
                const anterior = t.checklist[key];
                t.checklist[key] = !anterior;
                if (!saveData()) {
                    t.checklist[key] = anterior;
                    renderView('materia', materiaId);
                }
            }
        }

        function updateTopicNotes(materiaId, topicoId, notes) {
            const m = appData.materias.find(mat => mat.id === materiaId);
            const t = m && m.topicos.find(top => top.id === topicoId);
            if (t) {
                const anterior = t.anotaçoes;
                t.anotaçoes = notes;
                if (!saveData()) {
                    t.anotaçoes = anterior;
                    renderView('materia', materiaId);
                }
            }
        }

        function deleteTopic(materiaId, topicoId) {
            const linkedSessions = (appData.registrosEstudo || []).filter(r => r.materiaId === materiaId && r.topicoId === topicoId);
            if (linkedSessions.length) {
                alert('Este tópico possui ' + linkedSessions.length + ' registro(s) de estudo. Exclua ou reassocie esses registros antes de excluir o tópico, para preservar o histórico.');
                return;
            }
            if (confirm('Deseja realmente excluir este tópico?')) {
                const m = appData.materias.find(mat => mat.id === materiaId);
                if (!m) return;
                const topicosAnteriores = m.topicos;
                const planoAcoesAnterior = appData.planoAcoes || {};
                m.topicos = m.topicos.filter(t => t.id !== topicoId);
                appData.planoAcoes = Object.fromEntries(Object.entries(planoAcoesAnterior).filter(([key, action]) => action.topicoId !== topicoId));
                if (!saveData()) {
                    m.topicos = topicosAnteriores;
                    appData.planoAcoes = planoAcoesAnterior;
                    return;
                }
                renderView('materia', materiaId);
            }
        }

        function openNewTopicModal(materiaId) {
            const nome = prompt("Digite o nome do novo tópico:");
            if (nome && nome.trim()) {
                const m = appData.materias.find(mat => mat.id === materiaId);
                if (!m) return;
                const novoTopico = {
                    id: 't_' + Date.now(),
                    nome: nome.trim(),
                    status: 'Não iniciado',
                    checklist: { lei: false, questoes: false, erros: false, revisao: false, teoria: false },
                    anotaçoes: '',
                    questoesTotal: 0,
                    questoesAcertos: 0
                };
                m.topicos.push(novoTopico);
                if (!saveData()) {
                    m.topicos = m.topicos.filter(t => t.id !== novoTopico.id);
                    return;
                }
                renderView('materia', materiaId);
            }
        }

        function openSimuladoModal() {
            document.getElementById('sim-data').value = getLocalDateISO();
            document.getElementById('simulado-modal').classList.remove('hidden');
            document.getElementById('simulado-modal').classList.add('flex');
        }

        function closeSimuladoModal() {
            document.getElementById('simulado-modal').classList.remove('flex');
            document.getElementById('simulado-modal').classList.add('hidden');
        }

        function handleSimuladoSubmit(e) {
            e.preventDefault();
            const nome = document.getElementById('sim-nome').value;
            const data = document.getElementById('sim-data').value;
            const banca = document.getElementById('sim-banca').value;
            const qTotal = Number(document.getElementById('sim-qtotal').value);
            const qAcertos = Number(document.getElementById('sim-qacertos').value);
            const tempo = document.getElementById('sim-tempo').value;
            const obs = document.getElementById('sim-obs').value;

            if (!nome.trim() || !isValidPlannerDate(data) || !banca.trim() || !Number.isInteger(qTotal) || qTotal < 1 ||
                !Number.isInteger(qAcertos) || qAcertos < 0 || qAcertos > qTotal) {
                alert('Confira os dados do simulado: total deve ser um inteiro maior que zero e acertos um inteiro entre zero e o total.');
                return;
            }
            if (!appData.simulados) appData.simulados = [];
            const simulado = {
                id: Date.now(),
                nome: nome.trim(),
                data,
                banca: banca.trim(),
                qTotal,
                qAcertos,
                tempo,
                obs,
                origem: 'manual'
            };
            appData.simulados.push(simulado);
            if (!saveData()) {
                appData.simulados = appData.simulados.filter(s => s.id !== simulado.id);
                return;
            }
            closeSimuladoModal();
            renderView('simulados');
            alert('Simulado cadastrado com sucesso!');
        }

        function deleteSimulado(id) {
            if (confirm('Deseja realmente excluir este simulado?')) {
                const simuladosAnteriores = appData.simulados;
                appData.simulados = appData.simulados.filter(s => s.id !== id);
                if (!saveData()) {
                    appData.simulados = simuladosAnteriores;
                    return;
                }
                renderView('simulados');
            }
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `sedf_2027_planner_bre_backup_${getLocalDateISO()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importBackupFile(event) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert('O arquivo de backup excede o limite de 5 MB.');
                return;
            }
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const parsed = JSON.parse(reader.result);
                    const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
                    const isNonNegativeInteger = value => Number.isInteger(value) && value >= 0;
                    const validStatuses = ['Não iniciado', 'Estudando', 'Rever', 'Concluído'];
                    const validSafeId = id => typeof id === 'string' && /^[a-zA-Z0-9_-]{1,128}$/.test(id);\n                    const validTopic = t => isObject(t) && validSafeId(t.id) && typeof t.nome === 'string' &&
                        (t.status === undefined || validStatuses.includes(t.status)) &&
                        (t.anotaçoes === undefined || typeof t.anotaçoes === 'string') &&
                        (t.questoesTotal === undefined || isNonNegativeInteger(t.questoesTotal)) &&
                        (t.questoesAcertos === undefined || isNonNegativeInteger(t.questoesAcertos)) &&
                        (t.questoesTotal === undefined || t.questoesAcertos === undefined || t.questoesAcertos <= t.questoesTotal) &&
                        (isObject(t.checklist) && ['lei', 'questoes', 'erros', 'revisao', 'teoria'].every(k => typeof t.checklist[k] === 'boolean') && Object.keys(t.checklist).every(k => ['lei', 'questoes', 'erros', 'revisao', 'teoria'].includes(k)));
                    const validSubject = m => isObject(m) && validSafeId(m.id) && typeof m.nome === 'string' &&
                        (m.icone === undefined || ['fa-book', 'fa-map-location-dot', 'fa-landmark', 'fa-file-shield', 'fa-briefcase', 'fa-boxes-stacked', 'fa-pen-nib'].includes(m.icone)) &&
                        (m.prioridade === undefined || typeof m.prioridade === 'string') &&
                        Array.isArray(m.topicos) && m.topicos.every(validTopic);
                    const validRecord = r => isObject(r) && typeof r.materiaId === 'string' && r.materiaId.trim().length > 0 && typeof r.data === 'string' && isValidPlannerDate(r.data) && (r.plataforma === undefined || typeof r.plataforma === 'string') && (r.tempo === undefined || isNonNegativeInteger(r.tempo)) &&
                        (r.qTotal === undefined || isNonNegativeInteger(r.qTotal)) &&
                        (r.qAcertos === undefined || isNonNegativeInteger(r.qAcertos)) &&
                        (r.qTotal === undefined || r.qAcertos === undefined || r.qAcertos <= r.qTotal) &&
                        (r.obs === undefined || typeof r.obs === 'string');
                    const validSimulado = s => isObject(s) && typeof s.nome === 'string' && s.nome.trim().length > 0 &&
                        typeof s.data === 'string' && isValidPlannerDate(s.data) && typeof s.banca === 'string' && s.banca.trim().length > 0 &&
                        isNonNegativeInteger(s.qTotal) && s.qTotal > 0 && isNonNegativeInteger(s.qAcertos) && s.qAcertos <= s.qTotal &&
                        (s.tempo === undefined || typeof s.tempo === 'string') && (s.obs === undefined || typeof s.obs === 'string');
                    const validPlanAction = (key, action) => /^\\d{4}-\\d{2}-\\d{2}::\\d+$/.test(key) &&
                        isValidPlannerDate(key.split('::')[0]) && isObject(action) &&
                        (action.status === undefined || ['','Concluído','Adiado','Substituído'].includes(action.status)) &&
                        (action.materiaId === undefined || typeof action.materiaId === 'string') &&
                        (action.topicoId === undefined || typeof action.topicoId === 'string') &&
                        (action.deferredTo === undefined || isValidPlannerDate(action.deferredTo));
                    const validPlanActions = value => isObject(value) && Object.entries(value).every(([key, action]) => validPlanAction(key, action));
                    const idsMaterias = Array.isArray(parsed && parsed.materias) ? parsed.materias.map(m => m && m.id) : [];
                    const idsTopicos = Array.isArray(parsed && parsed.materias) ? parsed.materias.flatMap(m => Array.isArray(m && m.topicos) ? m.topicos.map(t => t && t.id) : []) : [];
                    const idsValidos = idsMaterias.every(id => typeof id === 'string' && id.trim().length > 0) &&
                        idsTopicos.every(id => typeof id === 'string' && id.trim().length > 0) &&
                        new Set(idsMaterias).size === idsMaterias.length && new Set(idsTopicos).size === idsTopicos.length;
                    const subjectIdSet = new Set(idsMaterias);
                    const topicIdSet = new Set(idsTopicos);
                    const topicOwnerById = new Map();
                    (parsed && Array.isArray(parsed.materias) ? parsed.materias : []).forEach(m =>
                        (Array.isArray(m.topicos) ? m.topicos : []).forEach(t => topicOwnerById.set(t.id, m.id)));
                    const recordsReferenceValidSubjects = Array.isArray(parsed && parsed.registrosEstudo) &&
                        parsed.registrosEstudo.every(r => r && subjectIdSet.has(r.materiaId) &&
                            (r.topicoId === undefined || r.topicoId === null || (topicIdSet.has(r.topicoId) && topicOwnerById.get(r.topicoId) === r.materiaId)));
                    const sessionIds = Array.isArray(parsed && parsed.registrosEstudo) ? parsed.registrosEstudo.map(r => r && r.id).filter(id => id !== undefined && id !== null) : [];
                    const sessionIdsUnique = new Set(sessionIds.map(String)).size === sessionIds.length;
                    const simuladoIds = Array.isArray(parsed && parsed.simulados) ? parsed.simulados.map(s => s && s.id).filter(id => id !== undefined && id !== null) : [];
                    const simuladoIdsUnique = new Set(simuladoIds.map(String)).size === simuladoIds.length;
                    const planReferencesValidSubjectsAndTopics = parsed && parsed.planoAcoes !== undefined &&
                        Object.values(parsed.planoAcoes).every(action => action &&
                            (action.materiaId === undefined || subjectIdSet.has(action.materiaId)) &&
                            (action.topicoId === undefined || (topicIdSet.has(action.topicoId) &&
                                (action.materiaId === undefined || topicOwnerById.get(action.topicoId) === action.materiaId))));
                    if (!isObject(parsed) || !Array.isArray(parsed.materias) || !parsed.materias.every(validSubject) || !idsValidos ||
                        !Array.isArray(parsed.registrosEstudo) || !parsed.registrosEstudo.every(validRecord) || !recordsReferenceValidSubjects || !sessionIdsUnique ||
                        (parsed.planoAcoes !== undefined && !planReferencesValidSubjectsAndTopics) ||
                        !Array.isArray(parsed.simulados) || !parsed.simulados.every(validSimulado) || !simuladoIdsUnique ||
                        (parsed.jurisprudencia !== undefined && !Array.isArray(parsed.jurisprudencia)) ||
                        (parsed.config !== undefined && !isObject(parsed.config)) ||
                        (parsed.planoAcoes !== undefined && !validPlanActions(parsed.planoAcoes))) {
                        throw new Error('Estrutura do backup inválida.');
                    }
                    if (!confirm('Importar este backup substituirá todos os dados atuais do planner. Deseja continuar?')) return;
                    window.__plannerRecoveryConfirmed = true;
                    window.__plannerDataRecoveryBlocked = false;
                    const dadosAnteriores = appData;
                    appData = Object.assign({}, JSON.parse(JSON.stringify(defaultData)), parsed);
                    appData.config = Object.assign({}, defaultData.config, parsed.config || {});
                    if (!saveData()) {
                        appData = dadosAnteriores;
                        return;
                    }
                    switchTab('dashboard');
                    alert('Backup importado com sucesso!');
                } catch (e) {
                    console.error('Falha na importação do backup:', e);
                    alert('Não foi possível importar o arquivo. Verifique se é um backup JSON válido do planner.');
                }
            };
            reader.onerror = function() { alert('Não foi possível ler o arquivo selecionado.'); };
            reader.readAsText(file);
        }

        function resetData() {
            if (confirm('Tem certeza que deseja restaurar os dados padrão? Os dados locais danificados foram preservados em uma cópia de recuperação.')) {
                window.__plannerRecoveryConfirmed = true;
                window.__plannerDataRecoveryBlocked = false;
                const dadosAnteriores = appData;
                appData = JSON.parse(JSON.stringify(defaultData));
                if (!saveData()) {
                    appData = dadosAnteriores;
                    return;
                }
                try {
                    localStorage.removeItem("sedf_2027_db");
                } catch(e) {
                    console.warn('Não foi possível remover a chave antiga de armazenamento:', e);
                }
                switchTab('dashboard');
                alert('Sistema restaurado com sucesso.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();
            updateQuickNav();
            updateSidebarHeader();
            switchTab('dashboard');
        });
    </script>
</body>
