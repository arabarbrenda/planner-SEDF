<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEDF 2027 - PLANNER DA BRE | Gestão de Estudos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js para Relatórios e Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Light Theme Overrides */
        body.light-mode {
            background-color: #f1f5f9 !important;
            color: #1e293b !important;
        }
        body.light-mode aside {
            background-color: #ffffff !important;
            border-right-color: #cbd5e1 !important;
        }
        body.light-mode main {
            background-color: #f8fafc !important;
        }
        body.light-mode header {
            background-color: #ffffff !important;
            border-bottom-color: #cbd5e1 !important;
        }
        body.light-mode header h2 {
            color: #0f172a !important;
        }
        body.light-mode .bg-slate-950,
        body.light-mode .bg-slate-900 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #1e293b !important;
        }
        body.light-mode .text-white {
            color: #0f172a !important;
        }
        body.light-mode .text-slate-100,
        body.light-mode .text-slate-300 {
            color: #334155 !important;
        }
        body.light-mode .text-slate-400,
        body.light-mode .text-slate-500 {
            color: #64748b !important;
        }
        body.light-mode input, body.light-mode select, body.light-mode textarea {
            background-color: #f8fafc !important;
            color: #0f172a !important;
            border-color: #cbd5e1 !important;
        }
        body.light-mode .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 font-sans antialiased flex md:flex-row overflow-hidden relative">

    <!-- BACKDROP MOBILE PARA FECHAR A BARRA LATERAL -->
    <div id="sidebar-backdrop" onclick="closeMobileSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-30 hidden md:hidden transition-opacity"></div>

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside id="main-sidebar" aria-label="Navegação Principal" class="fixed inset-y-0 left-0 w-72 max-w-[85vw] md:static md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col z-40 shrink-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out h-full">
        <div class="p-4 md:p-5 border-b border-slate-800 flex items-center space-x-3">
            <label for="icon-upload-input" class="cursor-pointer group relative shrink-0" title="Clique para alterar o ícone">
                <div id="sidebar-icon-container" class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-500/30 flex items-center justify-center w-11 h-11 overflow-hidden">
                    <i class="fa-solid fa-graduation-cap text-xl" id="sidebar-icon-elem"></i>
                </div>
                <input type="file" id="icon-upload-input" accept="image/*" class="hidden" onchange="handleIconUpload(event)">
            </label>
            <div class="flex-1 min-w-0">
                <div class="flex items-center space-x-1 group">
                    <h1 class="font-bold text-sm leading-tight tracking-wide text-white cursor-pointer hover:text-indigo-400 transition truncate" onclick="switchTab('dashboard')" id="header-title-text" title="Ir para o Dashboard Geral">SEDF 2027 - PLANNER DA BRE</h1>
                    <button type="button" onclick="editHeaderTitle()" class="text-slate-500 hover:text-indigo-400 text-xs opacity-100 md:opacity-0 md:group-hover:opacity-100 transition shrink-0" title="Editar título"><i class="fa-solid fa-pencil"></i></button>
                </div>
                <div class="flex items-center space-x-1 group mt-0.5">
                    <p class="text-xs text-slate-400 truncate cursor-pointer" onclick="editHeaderSubtitle()" id="header-subtitle-text" title="Clique para editar">Analista - Apoio Administrativo</p>
                    <button type="button" onclick="editHeaderSubtitle()" class="text-slate-500 hover:text-indigo-400 text-[10px] opacity-100 md:opacity-0 md:group-hover:opacity-100 transition shrink-0"><i class="fa-solid fa-pencil"></i></button>
                </div>
            </div>
            <!-- BOTÃO FECHAR / DIMINUIR BARRA NO MOBILE -->
            <button type="button" onclick="closeMobileSidebar()" aria-label="Fechar menu lateral" class="md:hidden text-slate-400 hover:text-white bg-slate-900 hover:bg-slate-800 border border-slate-800 w-9 h-9 rounded-xl flex items-center justify-center shrink-0 transition" title="Recolher menu">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 space-y-1 text-sm" role="navigation">
            <div class="flex items-center justify-between px-3 pb-2">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Menu Principal</p>
                <button type="button" onclick="openNewSubjectModal()" class="text-indigo-400 hover:text-indigo-300 text-xs font-semibold flex items-center space-x-1" title="Adicionar Matéria">
                    <i class="fa-solid fa-plus-circle"></i><span>Nova Matéria</span>
                </button>
            </div>
            <button type="button" onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium transition text-indigo-400 bg-indigo-500/10 text-left">
                <i class="fa-solid fa-chart-pie w-5 shrink-0"></i><span>Dashboard Geral</span>
            </button>
            <button type="button" onclick="switchTab('materias_lista')" id="nav-materias_lista" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium transition text-slate-300 hover:bg-slate-800 hover:text-white text-left">
                <i class="fa-solid fa-book-open w-5 shrink-0"></i><span>Matérias</span>
            </button>
            <button type="button" onclick="switchTab('planejamento')" id="nav-planejamento" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium transition text-slate-300 hover:bg-slate-800 hover:text-white text-left">
                <i class="fa-solid fa-calendar-days w-5 shrink-0"></i><span>Planejamento</span>
            </button>
            <button type="button" onclick="switchTab('ciclo')" id="nav-ciclo" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium transition text-slate-300 hover:bg-slate-800 hover:text-white text-left">
                <i class="fa-solid fa-rotate w-5 shrink-0"></i><span>Ciclo de Estudos</span>
            </button>
            <button type="button" onclick="switchTab('revisao')" id="nav-revisao" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium transition text-slate-300 hover:bg-slate-800 hover:text-white text-left">
                <i class="fa-solid fa-brain w-5 shrink-0"></i><span>Revisão Inteligente</span>
            </button>
            <button type="button" onclick="switchTab('baixo_aproveitamento')" id="nav-baixo_aproveitamento" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium transition text-slate-300 hover:bg-slate-800 hover:text-white text-left">
                <i class="fa-solid fa-triangle-exclamation w-5 shrink-0"></i><span>Baixo Aproveitamento</span>
            </button>
            <button type="button" onclick="switchTab('simulados')" id="nav-simulados" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium transition text-slate-300 hover:bg-slate-800 hover:text-white text-left">
                <i class="fa-solid fa-file-lines w-5 shrink-0"></i><span>Simulados</span>
            </button>
            <button type="button" onclick="switchTab('jurisprudencia')" id="nav-jurisprudencia" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium transition text-slate-300 hover:bg-slate-800 hover:text-white text-left">
                <i class="fa-solid fa-scale-balanced w-5 shrink-0"></i><span>Jurisprudência</span>
            </button>
            <button type="button" onclick="switchTab('importacao')" id="nav-importacao" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium transition text-slate-300 hover:bg-slate-800 hover:text-white text-left">
                <i class="fa-solid fa-file-arrow-up w-5 shrink-0"></i><span>Importar Tec Concursos</span>
            </button>
            <button type="button" onclick="switchTab('backup')" id="nav-backup" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium transition text-slate-300 hover:bg-slate-800 hover:text-white text-left">
                <i class="fa-solid fa-database w-5 shrink-0"></i><span>Backup & Configs</span>
            </button>

            <div class="pt-4">
                <p class="px-3 pb-2 text-xs font-semibold uppercase tracking-wider text-slate-500">Navegação Rápida (Matérias)</p>
                <div id="quick-nav-list" class="space-y-1"></div>
            </div>
        </nav>

        <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center space-y-2.5">
            <button type="button" onclick="closeMobileSidebar()" class="md:hidden w-full bg-slate-800 hover:bg-slate-700 text-white py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-angles-left text-indigo-400"></i>
                <span>Diminuir / Ocultar Menu</span>
            </button>
            <button type="button" onclick="toggleTheme()" id="theme-toggle-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-slate-300 py-2 px-3 rounded-xl text-xs font-semibold border border-slate-800 transition flex items-center justify-center space-x-2" title="Alternar entre Modo Escuro e Modo Claro">
                <i id="theme-icon" class="fa-solid fa-sun text-amber-400"></i>
                <span id="theme-text">Alternar Modo Claro</span>
            </button>
            <button type="button" onclick="exportToGoogleCalendar()" class="w-full bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 py-2 px-3 rounded-xl text-xs font-semibold border border-indigo-500/30 transition flex items-center justify-center space-x-1.5">
                <i class="fa-brands fa-google"></i><span>Exportar p/ Google Agenda</span>
            </button>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full w-full min-w-0 overflow-hidden bg-slate-900">
        <header class="bg-slate-950 border-b border-slate-800 px-4 md:px-6 py-3.5 md:py-4 flex items-center justify-between gap-2 shrink-0">
            <div class="flex items-center space-x-3 min-w-0">
                <!-- BOTÃO HAMBÚRGUER NO MOBILE -->
                <button type="button" id="mobile-menu-btn" onclick="toggleMobileSidebar()" aria-label="Abrir menu de navegação" class="md:hidden bg-slate-900 hover:bg-slate-800 text-indigo-400 border border-slate-800 w-10 h-10 rounded-xl flex items-center justify-center shrink-0 transition">
                    <i class="fa-solid fa-bars text-base"></i>
                </button>
                <h2 id="current-page-title" class="text-base sm:text-xl font-bold text-white tracking-wide truncate">Dashboard Geral</h2>
                <span class="hidden sm:inline-block px-3 py-1 bg-indigo-500/20 text-indigo-400 text-xs font-semibold rounded-full border border-indigo-500/30 shrink-0">Quadrix 2027</span>
            </div>
            <div class="flex items-center space-x-2 shrink-0">
                <button type="button" onclick="openStudyModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow-lg shadow-indigo-600/30 transition flex items-center space-x-1.5 sm:space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Registrar Estudo / Questões</span>
                    <span class="sm:hidden">Registrar</span>
                </button>
            </div>
        </header>

        <div id="view-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6"></div>
    </main>
