        let appData = JSON.parse(JSON.stringify(defaultData));

        function loadPersistedData() {
            try {
                const raw = localStorage.getItem("sga_sedf_2027_data") || localStorage.getItem("sedf_2027_db");
                if (raw) {
                    const parsed = JSON.parse(raw);
                    appData = Object.assign({}, JSON.parse(JSON.stringify(defaultData)), parsed);
                    appData.config = Object.assign({}, defaultData.config, parsed.config || {});
                    appData.registrosEstudo = Array.isArray(parsed.registrosEstudo) ? parsed.registrosEstudo : [];
                    appData.simulados = Array.isArray(parsed.simulados) ? parsed.simulados : [];
                    appData.jurisprudencia = Array.isArray(parsed.jurisprudencia) ? parsed.jurisprudencia : [];

                    if (Array.isArray(parsed.materias) && parsed.materias.length > 0) {
                        appData.materias = parsed.materias.map(m => Object.assign({
                            id: m.id || ('m_' + Date.now()),
                            nome: m.nome || 'Matéria',
                            icone: m.icone || 'fa-book',
                            prioridade: m.prioridade || 'Média',
                            topicos: Array.isArray(m.topicos) ? m.topicos.map(t => Object.assign({
                                id: t.id || ('t_' + Date.now()),
                                nome: t.nome || '',
                                status: t.status || 'Não iniciado',
                                checklist: Object.assign({ lei: false, questoes: false, erros: false, revisao: false, teoria: false }, t.checklist || {}),
                                anotaçoes: t.anotaçoes || '',
                                questoesTotal: Number(t.questoesTotal) || 0,
                                questoesAcertos: Number(t.questoesAcertos) || 0
                            }, t)) : []
                        }, m));
                    }
                }
            } catch (e) {}

            if (!appData.examDate) appData.examDate = "2027-05-20";
            if (!appData.startDate) appData.startDate = "2026-11-23";
            if (!appData.headerTitle || appData.headerTitle === "SGA-SEDF 2027") appData.headerTitle = "SEDF 2027 - PLANNER DA BRE";
            if (!appData.headerSubtitle) appData.headerSubtitle = "Analista - Apoio Administrativo";
            if (!appData.theme) appData.theme = "dark";
            if (!appData.consultDate) appData.consultDate = new Date().toISOString().split('T')[0];
        }

        function applyTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (appData.theme === 'light') {
                body.classList.add('light-mode');
                if (icon) icon.className = 'fa-solid fa-moon text-indigo-500';
                if (text) text.textContent = 'Alternar Modo Escuro';
            } else {
                body.classList.remove('light-mode');
                if (icon) icon.className = 'fa-solid fa-sun text-amber-400';
                if (text) text.textContent = 'Alternar Modo Claro';
            }
        }

        function toggleTheme() {
            appData.theme = appData.theme === 'light' ? 'dark' : 'light';

        }

        function exportToGoogleCalendar() {
            const title = encodeURIComponent("Estudos SEDF 2027 - PLANNER DA BRE");
            const details = encodeURIComponent("Rotina diária de estudos para Analista - Apoio Administrativo SEDF 2027.");
            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=20261123T140000Z/20270520T180000Z&recur=RRULE:FREQ=DAILY`;
            window.open(url, '_blank');
        }

        function openEditalVerticalizado() {
            const editalText = `EDITAL VERTICALIZADO - SEDF 2027\nCARGO: ANALISTA EM POLÍTICAS PÚBLICAS E GESTÃO EDUCACIONAL - APOIO ADMINISTRATIVO\nBANCA: INSTITUTO QUADRIX\n\n`;
            let conteudo = editalText;
            appData.materias.forEach(m => {
                conteudo += `==================================================\nDISCIPLINA: ${m.nome.toUpperCase()} (Prioridade: ${m.prioridade})\n==================================================\n`;
                m.topicos.forEach((t, i) => {
                    conteudo += `  ${i+1}. ${t.nome} [${t.status}]\n`;
                });
                conteudo += `\n`;
            });
            const blob = new Blob([conteudo], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        function getGlobalStats() {
            let totalTopicos = 0;
            let concluidos = 0;
            let totalQuestoes = 0;
            let totalAcertos = 0;
            let totalMinutos = 0;

            appData.materias.forEach(m => {
                m.topicos.forEach(t => {
                    totalTopicos++;
                    if (t.status === 'Concluído') concluidos++;
                    totalQuestoes += (t.questoesTotal || 0);
                    totalAcertos += (t.questoesAcertos || 0);
                });
            });

            appData.registrosEstudo.forEach(r => {
                totalMinutos += (r.tempo || 0);
            });

            const progressoGeral = totalTopicos > 0 ? Math.round((concluidos / totalTopicos) * 100) : 0;
            const aproveitamentoGeral = totalQuestoes > 0 ? Math.round((totalAcertos / totalQuestoes) * 100) : 0;
            const horasEstudadas = (totalMinutos / 60).toFixed(1);

            const hoje = new Date();
            const prova = new Date(appData.examDate + 'T00:00:00');
            const diffTime = prova - hoje;
            const diasRestantes = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            return { totalTopicos, concluidos, progressoGeral, totalQuestoes, aproveitamentoGeral, horasEstudadas, diasRestantes };
        }

        function renderMateriaListaCard(m) {
            const total = m.topicos.length;
            const concluidos = m.topicos.filter(t => t.status === 'Concluído').length;

            let qTotalMat = 0;
            let qAcertosMat = 0;
            m.topicos.forEach(t => {
                qTotalMat += (t.questoesTotal || 0);
                qAcertosMat += (t.questoesAcertos || 0);
            });
            const apMat = qTotalMat > 0 ? Math.round((qAcertosMat / qTotalMat) * 100) : 0;

            return `
                <div class="bg-slate-900 border border-slate-800 hover:border-indigo-500/40 p-4 rounded-xl shadow-md flex flex-col justify-between space-y-3 transition">

                                <p class="text-[10px] text-slate-400 mt-0.5">${concluidos}/${total} tópicos | ${apMat}% acertos (${qTotalMat}q)</p>
                            </div>

                            <option value="Alta" ${m.prioridade === 'Alta' ? 'selected' : ''}>Alta (Vermelho)</option>
                            <option value="Média" ${m.prioridade === 'Média' ? 'selected' : ''}>Média (Azul)</option>
                            <option value="Baixa" ${m.prioridade === 'Baixa' ? 'selected' : ''}>Baixa (Cinza)</option>

                    <div class="cursor-pointer space-y-1" onclick="switchTab('materia', '${m.id}')">

                            <span class="text-indigo-400 font-bold">${perc}%</span>

                <div class="space-y-6">
                    <div class="bg-slate-950 border border-slate-800 p-6 rounded-2xl shadow-xl flex justify-between items-center">
                        <div>
                            <h3 class="text-lg font-bold text-white">Registro de Simulados & Desempenho</h3>
                            <p class="text-xs text-slate-400">Acompanhe sua evolução por questões e simulados.</p>
                        </div>
                        <button onclick="openSimuladoModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow flex items-center space-x-2">
                            <i class="fa-solid fa-plus"></i><span>Novo Simulado Manual</span>
                        </button>
                    </div>
                    <div class="bg-slate-950 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
                        <h4 class="font-bold text-white text-sm mb-3"><i class="fa-solid fa-file-lines text-indigo-400 mr-2"></i>Histórico de Simulados (Tec Concursos & Manuais)</h4>
                        <div class="space-y-3">
                            ${appData.simulados && appData.simulados.length > 0 ? appData.simulados.map(s => {
                                const total = s.qTotal || s.total || 0;
                                const acertos = s.qAcertos || s.acertos || 0;
                                const ap = total > 0 ? Math.round((acertos / total) * 100) : 0;
                                return `
                                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                        <div>
                                            <div class="flex items-center space-x-2">
                                                <h4 class="text-sm font-bold text-white">${s.nome}</h4>
                                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md ${s.origem === 'tec' ? 'bg-purple-500/20 text-purple-400 border border-purple-500/30' : 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30'}">${s.origem === 'tec' ? 'Tec Concursos' : 'Manual'}</span>
                                            </div>
                                            <p class="text-xs text-slate-400 mt-1">Data: ${formatarDataPtBr(s.data || '2026-11-25')} | Banca: ${s.banca || 'Quadrix'} | Tempo: ${s.tempo || '3h'}</p>
                                        </div>
                                        <div class="flex items-center space-x-4 w-full md:w-auto justify-between">
                                            <div class="text-right">
                                                <span class="text-sm font-bold text-indigo-400">${acertos} / ${total} acertos</span>
                                                <p class="text-xs text-slate-400">${ap}% de aproveitamento</p>
                                            </div>
                                            <button onclick="deleteSimulado(${s.id})" class="text-slate-500 hover:text-red-400 text-xs p-1.5 bg-red-500/10 rounded-lg border border-red-500/20" title="Excluir Simulado"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                `;
                            }).join('') : `
                                <div class="text-center py-8 text-slate-400 text-xs bg-slate-900 rounded-xl border border-slate-800">
                                    Nenhum simulado registrado ou importado até o momento.
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderJurisprudenciaHTML() {
            return `
                <div class="space-y-6">
                    <div class="bg-slate-950 border border-slate-800 p-6 rounded-2xl shadow-xl flex justify-between items-center">
                        <div>
                            <h3 class="text-lg font-bold text-white">Jurisprudência e Informativos</h3>
                            <p class="text-xs text-slate-400">Entendimentos consolidados do STF, STJ e TJDFT para o concurso.</p>
                        </div>
                    </div>
                    <div class="space-y-3">
                        ${appData.jurisprudencia.map(j => `
                            <div class="bg-slate-950 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-500/20 text-indigo-400 rounded-md">${j.tribunal} - ${j.materia}</span>
                                    <span class="text-xs text-slate-400">${formatarDataPtBr(j.data)}</span>
                                </div>
                                <h4 class="text-sm font-bold text-white">${j.tema}</h4>
                                <p class="text-xs text-slate-300 bg-slate-900 p-3 rounded-xl border border-slate-900"><strong>Tese:</strong> ${j.tese}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderImportacaoHTML() {
            return `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <div class="bg-slate-950 border border-slate-800 p-8 rounded-2xl shadow-xl text-center space-y-4">
                        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto border border-indigo-500/30">
                            <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white">Importar Dados</h3>
                        <p class="text-xs text-slate-400">Faça o upload do seu relatório em formato CSV ou XLSX exportado para atualizar automaticamente seu progresso e aproveitamento.</p>
                        <input type="file" id="import-file" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer border border-slate-800 rounded-xl bg-slate-900 p-2">
                        <button onclick="processTecImportSimulation()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30 transition">Processar e Sincronizar</button>
                    </div>
                </div>
            `;
        }

        function renderBackupHTML() {
            return `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <div class="bg-slate-950 border border-slate-800 p-8 rounded-2xl shadow-xl space-y-4">
                        <h3 class="text-lg font-bold text-white">Exportar Dados</h3>
                        <p class="text-xs text-slate-400">Exporte todos os seus registros de estudos, anotações e progresso em formato JSON para garantir total segurança.</p>
                        <div class="flex space-x-3 pt-2">
                            <button onclick="exportBackup()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-download mr-2"></i>Exportar Backup JSON</button>
                            <button onclick="resetData()" class="px-4 bg-red-600/20 hover:bg-red-600/30 text-red-400 py-2.5 rounded-xl text-xs font-semibold border border-red-500/30 transition">Restaurar Padrão</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateQuickNav() {
            const list = document.getElementById('quick-nav-list');
            list.innerHTML = appData.materias.map(m => {
                const total = m.topicos.length;
                const concluidos = m.topicos.filter(t => t.status === 'Concluído').length;
                const perc = total > 0 ? Math.round((concluidos / total) * 100) : 0;
                const isExpanded = expandedSidebarSubjects[m.id] || false;

                return `
                    <div class="space-y-1">
                        <div class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs text-slate-300 hover:bg-slate-800 transition">
                            <div class="flex items-center space-x-2 truncate flex-1 cursor-pointer" onclick="switchTab('materia', '${m.id}')">
                                <i class="fa-solid ${m.icone} w-4 text-indigo-400 shrink-0"></i>
                                <span class="truncate">${m.nome}</span>
                            </div>
                            <div class="flex items-center space-x-2 shrink-0">
                                <span class="text-[10px] font-bold text-indigo-400 bg-indigo-500/10 px-1.5 py-0.5 rounded-md">${perc}%</span>
                                <button onclick="toggleSidebarSubject('${m.id}')" class="text-slate-400 hover:text-white p-1" title="Expandir tópicos">
                                    <i class="fa-solid ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'} text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                        ${isExpanded ? `
                            <div class="pl-6 space-y-1 pb-1">
                                ${m.topicos.map(t => `
                                    <button onclick="switchTab('materia', '${m.id}')" class="w-full text-left truncate text-[11px] text-slate-400 hover:text-indigo-300 py-1 px-2 rounded-lg hover:bg-slate-900 transition">
                                        • ${t.nome}
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function toggleSidebarSubject(materiaId) {
            expandedSidebarSubjects[materiaId] = !expandedSidebarSubjects[materiaId];
            updateQuickNav();
        }

        function enableTopicEdit(materiaId, topicoId) {
            const m = appData.materias.find(mat => mat.id === materiaId);
            const t = m.topicos.find(top => top.id === topicoId);
            const container = document.getElementById(`topic-name-container-${topicoId}`);
            
            container.innerHTML = `
                <input type="text" id="input-edit-topic-${topicoId}" value="${t.nome}" class="bg-slate-900 border border-indigo-500 text-xs text-white rounded-lg px-2 py-1 flex-1 focus:outline-none">
                <button onclick="saveTopicEdit('${materiaId}', '${topicoId}')" class="text-emerald-400 hover:text-emerald-300 text-xs px-2 py-1 bg-emerald-500/10 rounded-lg"><i class="fa-solid fa-check"></i></button>
                <button onclick="cancelTopicEdit('${materiaId}', '${topicoId}')" class="text-slate-400 hover:text-slate-300 text-xs px-2 py-1 bg-slate-800 rounded-lg"><i class="fa-solid fa-xmark"></i></button>
            `;
        }

        function saveTopicEdit(materiaId, topicoId) {
            const novoNome = document.getElementById(`input-edit-topic-${topicoId}`).value.trim();
            if (novoNome) {
                const m = appData.materias.find(mat => mat.id === materiaId);
                const t = m.topicos.find(top => top.id === topicoId);
                t.nome = novoNome;
                saveData();
                renderView('materia', materiaId);
            }
        }

        function cancelTopicEdit(materiaId, topicoId) {
            renderView('materia', materiaId);
        }

        function clearTopicData(materiaId, topicoId) {
            if (confirm("Deseja realmente limpar todos os dados deste tópico?")) {
                const m = appData.materias.find(mat => mat.id === materiaId);
                const t = m.topicos.find(top => top.id === topicoId);
                if (t) {
                    t.status = "Não iniciado";
                    t.checklist = { lei: false, questoes: false, erros: false, revisao: false, teoria: false };
                    t.anotaçoes = "";
                    t.questoesTotal = 0;
                    t.questoesAcertos = 0;
                    saveData();
                    renderView('materia', materiaId);
                }
            }
        }

        function saveTopicQuestionsDirect(materiaId, topicoId) {
            const total = parseInt(document.getElementById(`q-total-${topicoId}`).value) || 0;
            const acertos = parseInt(document.getElementById(`q-acertos-${topicoId}`).value) || 0;
            const m = appData.materias.find(mat => mat.id === materiaId);
            const t = m.topicos.find(top => top.id === topicoId);
            if (t) {
                t.questoesTotal = total;
                t.questoesAcertos = acertos > total ? total : acertos;
                saveData();
                renderView('materia', materiaId);
            }
        }

        function openStudyModal() {
            const select = document.getElementById('modal-materia');
            select.innerHTML = appData.materias.map(m => `<option value="${m.id}">${m.nome}</option>`).join('');
            document.getElementById('modal-data').value = new Date().toISOString().split('T')[0];
            document.getElementById('study-modal').classList.remove('hidden');
            document.getElementById('study-modal').classList.add('flex');
        }

        function closeStudyModal() {
            document.getElementById('study-modal').classList.remove('flex');
            document.getElementById('study-modal').classList.add('hidden');
        }

        function handleStudySubmit(e) {
            e.preventDefault();
            const materiaId = document.getElementById('modal-materia').value;
            const data = document.getElementById('modal-data').value;
            const plataforma = document.getElementById('modal-plataforma').value;
            const tempo = parseInt(document.getElementById('modal-tempo').value);
            const qTotal = parseInt(document.getElementById('modal-qtotal').value) || 0;
            const qAcertos = parseInt(document.getElementById('modal-qacertos').value) || 0;
            const obs = document.getElementById('modal-obs').value;

            appData.registrosEstudo.push({ id: Date.now(), materiaId, data, plataforma, tempo, qTotal, qAcertos, obs });
            saveData();
            closeStudyModal();
            switchTab(currentActiveTab, currentActiveTab === 'materia' ? materiaId : null);
            alert('Sessão de estudo registrada com sucesso!');
        }

        function updateTopicStatus(materiaId, topicoId, status) {
            const m = appData.materias.find(mat => mat.id === materiaId);
            const t = m.topicos.find(top => top.id === topicoId);
            if (t) {
                t.status = status;
                saveData();
            }
        }

        function toggleChecklist(materiaId, topicoId, key) {
            const m = appData.materias.find(mat => mat.id === materiaId);
            const t = m.topicos.find(top => top.id === topicoId);
            if (t) {
                t.checklist[key] = !t.checklist[key];
                saveData();
            }
        }

        function updateTopicNotes(materiaId, topicoId, notes) {
            const m = appData.materias.find(mat => mat.id === materiaId);
            const t = m.topicos.find(top => top.id === topicoId);
            if (t) {
                t.anotaçoes = notes;
                saveData();
            }
        }

        function deleteTopic(materiaId, topicoId) {
            if (confirm('Deseja realmente excluir este tópico?')) {
                const m = appData.materias.find(mat => mat.id === materiaId);
                m.topicos = m.topicos.filter(t => t.id !== topicoId);
                saveData();
                renderView('materia', materiaId);
            }
        }

        function openNewTopicModal(materiaId) {
            const nome = prompt("Digite o nome do novo tópico:");
            if (nome) {
                const m = appData.materias.find(mat => mat.id === materiaId);
                m.topicos.push({
                    id: 't_' + Date.now(),
                    nome,
                    status: 'Não iniciado',
                    checklist: { lei: false, questoes: false, erros: false, revisao: false, teoria: false },
                    anotaçoes: '',
                    questoesTotal: 0,
                    questoesAcertos: 0
                });
                saveData();
                renderView('materia', materiaId);
            }
        }

        function openSimuladoModal() {
            document.getElementById('sim-data').value = new Date().toISOString().split('T')[0];
            document.getElementById('simulado-modal').classList.remove('hidden');
            document.getElementById('simulado-modal').classList.add('flex');
        }

        function closeSimuladoModal() {
            document.getElementById('simulado-modal').classList.remove('flex');
            document.getElementById('simulado-modal').classList.add('hidden');
        }

        function handleSimuladoSubmit(e) {
            e.preventDefault();
            const nome = document.getElementById('sim-nome').value;
            const data = document.getElementById('sim-data').value;
            const banca = document.getElementById('sim-banca').value;
            const qTotal = parseInt(document.getElementById('sim-qtotal').value) || 120;
            const qAcertos = parseInt(document.getElementById('sim-qacertos').value) || 0;
            const tempo = document.getElementById('sim-tempo').value;
            const obs = document.getElementById('sim-obs').value;

            if (!appData.simulados) appData.simulados = [];
            appData.simulados.push({
                id: Date.now(),
                nome,
                data,
                banca,
                qTotal,
                qAcertos,
                tempo,
                obs,
                origem: 'manual'
            });
            saveData();
            closeSimuladoModal();
            renderView('simulados');
            alert('Simulado cadastrado com sucesso!');
        }

        function deleteSimulado(id) {
            if (confirm('Deseja realmente excluir este simulado?')) {
                appData.simulados = appData.simulados.filter(s => s.id !== id);
                saveData();
                renderView('simulados');
            }
        }

        function processTecImportSimulation() {
            if (!appData.simulados) appData.simulados = [];
            appData.simulados.push({
                id: Date.now(),
                nome: "Simulado Tec Concursos - Relatório Importado",
                data: new Date().toISOString().split('T')[0],
                banca: "Quadrix",
                qTotal: 120,
                qAcertos: 96,
                tempo: "3h10",
                obs: "Importado via relatório do Tec Concursos.",
                origem: 'tec'
            });
            saveData();
            alert('Relatório do Tec Concursos processado com sucesso! Simulado integrado e dados sincronizados.');
            switchTab('simulados');
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `sedf_2027_planner_bre_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function resetData() {
            if (confirm('Tem certeza que deseja restaurar os dados padrão?')) {
                try {
                    localStorage.removeItem("sga_sedf_2027_data");
                    localStorage.removeItem("sedf_2027_db");
                } catch(e) {}
                appData = JSON.parse(JSON.stringify(defaultData));
                saveData();
                switchTab('dashboard');
                alert('Sistema restaurado com sucesso.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();
            updateQuickNav();
            updateSidebarHeader();
            switchTab('dashboard');
        });
    </script>
</body>
</html>
